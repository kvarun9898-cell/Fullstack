

services:
  backend:
    build: ./backend
    container_name: backend-container
    ports:
      - "8001:8000"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: frontend-container
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
